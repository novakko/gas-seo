    // Ensure $.validator exists and has required methods
    $(document).ready(function() {
        if (typeof $.validator === 'undefined') {
            console.warn('jQuery Validation not loaded properly');
        } else {
            // Initialize default messages if needed
            if (!$.validator.messages) {
                $.validator.messages = {
                    required: "This field is required.",
                    url: "Please enter a valid URL."
                };
            }
        }
        
        // Initialize $.plot.plugins array to prevent Flot errors
        if (typeof $.plot === 'undefined') {
            console.warn('jQuery Flot not loaded properly');
        } else if (typeof $.plot.plugins === 'undefined') {
            $.plot.plugins = [];
        }
    });
</script>
